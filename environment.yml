# NOTE: this file does not include OpenFOAM installation

name: permeator-probe-env
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.13
  - sphinx-tags
  - matplotlib
  - meshio[all]
  - pip>=20.1
  - ipykernel
  - nbconvert
  - fenics-dolfinx
  # - festim=2.0b1
  - python-gmsh
  - pip:
    - pyparsing
    - h-transport-materials==0.16
    - pyvista[all,trame]  # trame cannot be installed on conda
    - git+https://github.com/festim-dev/foam2dolfinx
    - git+https://github.com/festim-dev/FESTIM@6612b9c59cdde1c006d0a7ba1ad3265a8ce08368 # commit with surfaceRecomboBC bug fix